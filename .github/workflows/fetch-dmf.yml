name: Fetch DMF data

on:
  schedule:
    # 매일 09:00 KST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch DMF data
        run: node scripts/fetch-dmf.mjs
        env:
          DMF_API_KEY: ${{ secrets.DMF_API_KEY }}

      - name: Copy data for GitHub Pages
        run: |
          mkdir -p docs/data
          cp data/latest.json docs/data/latest.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json docs/data/latest.json
          git diff --cached --quiet || git commit -m "chore: DMF 데이터 갱신 $(date -u +%F)"
          git push
